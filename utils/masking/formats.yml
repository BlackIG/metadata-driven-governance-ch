formats:
  name: "replaceRegexpOne($column_name, '^(.{4})(.*)$$', '\\1****')"
  email: "replaceRegexpOne($column_name, '^(.{0})[^@]*(@.*)$$', '\\1****\\2')"
  phone: "replaceRegexpOne($column_name, '^(.{3})(.*)(.{2})$$', '\\1****\\3')"
  address: "replaceRegexpOne($column_name, '^[^,]+,\\s*(.*)$$', '*** \\1')"

defaults:
  String:
    data_types: ['String', 'LowCardinality(String)', 'FixedString', 'UUID']
    expression: "'******'"
  Int:
    data_types: ['Int8', 'Int16', 'Int32', 'Int64', 'UInt8', 'UInt16', 'UInt32', 'UInt64']
    expression: "0"
  Float:
    data_types: ['Float32', 'Float64', 'Decimal']
    expression: "0.0"
  Date:
    data_types: ['Date', 'Date32']
    expression: "'1970-01-01'"
  DateTime:
    data_types: ['DateTime', 'DateTime64']
    expression: "'1970-01-01 00:00:00'"
  